[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ahuverify"
version = "0.0.1"
description = "AHU Sequence Verifier engine (steady-state psychrometrics and controls)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.setuptools.packages.find]
include = ["ahuverify*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
# Vendored third-party code is kept byte-for-byte as released.
extend-exclude = ["ahuverify/_vendor"]
